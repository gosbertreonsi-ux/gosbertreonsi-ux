<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="An anime coder on a rolling desk drives forward, leaving the words Building secure, real-time systems behind" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.55" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#f778ba"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="rev">
      <rect x="0" y="0" height="230" width="60">
        <animate attributeName="width" dur="10s" repeatCount="indefinite"
                 keyTimes="0;0.6;0.8;1" values="60;730;730;730"/>
      </rect>
    </clipPath>
  </defs>

  <!-- panel -->
  <rect x="1" y="1" width="898" height="228" rx="14" fill="#0d1117" stroke="#30363d"/>

  <!-- moving ground -->
  <line x1="20" y1="205" x2="880" y2="205" stroke="#30363d" stroke-width="2" stroke-dasharray="8 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-18" dur="0.5s" repeatCount="indefinite"/>
  </line>

  <!-- words left behind -->
  <g clip-path="url(#rev)">
    <g>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
               keyTimes="0;0.9;0.98;1" values="1;1;0;0"/>
      <text x="150" y="50" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace"
            font-size="28" font-weight="700" fill="#58a6ff" opacity="0.55" filter="url(#glow)"
            textLength="571" lengthAdjust="spacingAndGlyphs">Building secure, real-time systems</text>
      <text x="150" y="50" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace"
            font-size="28" font-weight="700" fill="url(#g)"
            textLength="571" lengthAdjust="spacingAndGlyphs">Building secure, real-time systems</text>
    </g>
  </g>

  <!-- the coder, driving forward -->
  <g transform="translate(40 205)">
    <animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite"
                      keyTimes="0;0.6;0.8;1" values="40 205;710 205;960 205;960 205"/>
    <g opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.05;1" values="0;1;1"/>

      <!-- speed lines trailing behind -->
      <g stroke="#58a6ff" stroke-width="3" stroke-linecap="round" opacity="0">
        <line x1="-14" y1="-90" x2="-52" y2="-90"/>
        <line x1="-14" y1="-66" x2="-70" y2="-66"/>
        <line x1="-14" y1="-42" x2="-44" y2="-42"/>
        <animate attributeName="opacity" values="0;0.7;0" dur="0.5s" repeatCount="indefinite"/>
      </g>

      <!-- wheels (they spin) -->
      <g transform="translate(15 -6)"><circle r="6" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
        <g><line x1="-4" y1="0" x2="4" y2="0" stroke="#8b949e" stroke-width="2"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.4s" repeatCount="indefinite"/></g></g>
      <g transform="translate(55 -6)"><circle r="6" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
        <g><line x1="-4" y1="0" x2="4" y2="0" stroke="#8b949e" stroke-width="2"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.4s" repeatCount="indefinite"/></g></g>
      <g transform="translate(90 -5)"><circle r="5" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
        <g><line x1="-3" y1="0" x2="3" y2="0" stroke="#8b949e" stroke-width="2"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.4s" repeatCount="indefinite"/></g></g>
      <g transform="translate(160 -5)"><circle r="5" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
        <g><line x1="-3" y1="0" x2="3" y2="0" stroke="#8b949e" stroke-width="2"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.4s" repeatCount="indefinite"/></g></g>

      <!-- everything above the wheels bobs gently -->
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -2;0 0" dur="0.5s" repeatCount="indefinite"/>

        <!-- chair -->
        <rect x="33" y="-30" width="4" height="18" fill="#8b949e"/>
        <rect x="12" y="-14" width="46" height="4" rx="2" fill="#8b949e"/>
        <rect x="8" y="-42" width="58" height="12" rx="6" fill="#21262d" stroke="#30363d"/>
        <rect x="0" y="-92" width="11" height="54" rx="5" fill="#21262d" stroke="#30363d"/>

        <!-- desk -->
        <rect x="86" y="-56" width="5" height="46" fill="#30363d"/>
        <rect x="150" y="-56" width="5" height="46" fill="#30363d"/>
        <rect x="80" y="-62" width="92" height="7" rx="3" fill="#484f58"/>

        <!-- keyboard -->
        <rect x="88" y="-67" width="30" height="5" rx="2" fill="#8b949e"/>

        <!-- monitor -->
        <rect x="140" y="-74" width="8" height="12" fill="#30363d"/>
        <rect x="120" y="-124" width="52" height="52" rx="5" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
        <rect x="124" y="-120" width="44" height="44" rx="3" fill="#0d1117"/>
        <rect x="128" y="-114" width="20" height="3" rx="1.5" fill="#58a6ff"><animate attributeName="width" values="10;26;10" dur="1.1s" repeatCount="indefinite"/></rect>
        <rect x="132" y="-107" width="28" height="3" rx="1.5" fill="#a371f7"><animate attributeName="width" values="30;12;30" dur="0.9s" repeatCount="indefinite"/></rect>
        <rect x="132" y="-100" width="18" height="3" rx="1.5" fill="#f778ba"><animate attributeName="width" values="8;30;8" dur="1.3s" repeatCount="indefinite"/></rect>
        <rect x="128" y="-93" width="30" height="3" rx="1.5" fill="#7ee787"><animate attributeName="width" values="16;32;16" dur="0.8s" repeatCount="indefinite"/></rect>
        <rect x="128" y="-86" width="14" height="3" rx="1.5" fill="#ffa657"><animate attributeName="width" values="24;8;24" dur="1.2s" repeatCount="indefinite"/></rect>
        <rect x="128" y="-79" width="8" height="3" rx="1.5" fill="#58a6ff"><animate attributeName="opacity" values="1;0;1" dur="0.7s" repeatCount="indefinite"/></rect>

        <!-- legs -->
        <rect x="22" y="-52" width="54" height="13" rx="6" fill="#2b3a67"/>
        <rect x="68" y="-52" width="12" height="42" rx="5" fill="#2b3a67"/>
        <ellipse cx="78" cy="-8" rx="11" ry="5" fill="#f0f6fc"/>
        <rect x="68" y="-22" width="12" height="3" fill="#58a6ff"/>

        <!-- hoodie torso -->
        <rect x="14" y="-92" width="28" height="52" rx="12" fill="#4c6fff"/>
        <rect x="26" y="-70" width="3" height="26" rx="1.5" fill="#a9b8ff"/>
        <path d="M16 -92 Q28 -84 40 -92 L38 -86 Q28 -79 18 -86 Z" fill="#3a56d4"/>

        <!-- typing arm -->
        <line x1="30" y1="-80" x2="92" y2="-64" stroke="#4c6fff" stroke-width="9" stroke-linecap="round">
          <animate attributeName="y2" values="-64;-69;-64" dur="0.3s" repeatCount="indefinite"/>
        </line>
        <circle cx="92" cy="-64" r="5" fill="#ffd9c2">
          <animate attributeName="cy" values="-64;-69;-64" dur="0.3s" repeatCount="indefinite"/>
        </circle>

        <!-- head -->
        <rect x="24" y="-100" width="12" height="12" fill="#ffd9c2"/>
        <circle cx="30" cy="-114" r="20" fill="#ffd9c2"/>
        <!-- back hair spikes -->
        <polygon points="11,-112 -6,-116 8,-124" fill="#1d2a5c"/>
        <polygon points="12,-124 -4,-134 16,-132" fill="#1d2a5c"/>
        <polygon points="18,-132 8,-148 28,-136" fill="#1d2a5c"/>
        <!-- fringe -->
        <path d="M9 -112 C6 -142 30 -144 44 -136 C54 -130 52 -118 50 -113 L45 -122 L41 -115 L36 -126 L31 -116 L26 -127 L21 -115 L15 -123 Z" fill="#1d2a5c"/>
        <path d="M20 -134 Q30 -140 40 -134" stroke="#58a6ff" stroke-width="2" fill="none" opacity="0.8"/>
        <!-- big anime eye -->
        <ellipse cx="41" cy="-112" rx="5" ry="6.5" fill="#1b1f3b"/>
        <ellipse cx="41" cy="-110" rx="3.3" ry="4.3" fill="#58a6ff"/>
        <circle cx="42.7" cy="-114" r="1.8" fill="#fff"/>
        <circle cx="39.8" cy="-108.5" r="0.9" fill="#fff"/>
        <path d="M36 -119 Q41 -121 46 -118" stroke="#1b1f3b" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <!-- blush + smile -->
        <ellipse cx="44" cy="-102" rx="4" ry="2.2" fill="#ff8fb1" opacity="0.55"/>
        <path d="M39 -99 Q42 -96.5 45 -99" stroke="#8a3b4f" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        <!-- headphones -->
        <path d="M11 -116 Q30 -150 50 -118" stroke="#58a6ff" stroke-width="4" fill="none" stroke-linecap="round"/>
        <circle cx="13" cy="-108" r="7" fill="#58a6ff"/>
        <circle cx="13" cy="-108" r="3" fill="#0d1117"/>
      </g>
    </g>
  </g>
</svg>
